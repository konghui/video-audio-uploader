# 构建整个项目,并把多架构 Docker 镜像推送到 Docker Hub
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置两个 secret:
#   DOCKERHUB_USERNAME  Docker Hub 用户名(konghui)
#   DOCKERHUB_TOKEN     Docker Hub 密码,或(推荐)Access Token
#                       在 https://hub.docker.com/settings/security 创建 token
#
# 镜像:docker.io/konghui/video-audio-uploader
# 标签:main → latest;打 tag(如 v1.0.0)→ 语义化版本;始终带 commit 短 SHA。
#
# 说明:采用「原生 runner 矩阵 + 清单合并」构建多架构(amd64 + arm64)。
# 每种架构在对应架构的 runner 上原生构建,避免 QEMU 跨架构模拟在 Node/vite
# 构建时段错误(signal 11)的问题。

name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main] # PR 只跑 test 校验,不推镜像
  workflow_dispatch: {}

env:
  REGISTRY_IMAGE: docker.io/konghui/video-audio-uploader

jobs:
  # ---------- 1. 构建 + 测试整个项目 ----------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装后端依赖
        run: npm ci --no-audit --no-fund
      - name: 编译后端 (tsc)
        run: npm run build
      - name: 单元测试 (vitest)
        run: npm test
      - name: 构建前端 (vite)
        run: cd web && npm ci --no-audit --no-fund && npm run build

  # ---------- 2. 各架构原生构建并按 digest 推送 ----------
  build:
    name: Build ${{ matrix.platform }}
    needs: test
    if: github.event_name != 'pull_request' # PR 不构建/推送镜像
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 生成平台名(用于文件名)
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 原生构建并按 digest 推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: 导出 digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------- 3. 合并成一个多架构镜像清单并打标签 ----------
  merge:
    name: Merge & Tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有 digest
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 创建并推送多架构清单
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: 校验结果
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
