# 构建整个项目,并把 Docker 镜像(linux/amd64)推送到 Docker Hub
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置两个 secret:
#   DOCKERHUB_USERNAME  Docker Hub 用户名(konghui)
#   DOCKERHUB_TOKEN     Docker Hub 密码,或(推荐)Access Token
#                       在 https://hub.docker.com/settings/security 创建 token
#
# 镜像:docker.io/konghui/video-audio-uploader
# 标签:main → latest;打 tag(如 v1.0.0)→ 语义化版本;始终带 commit 短 SHA。

name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main] # PR 只跑 test 校验,不推镜像
  workflow_dispatch: {}

env:
  REGISTRY_IMAGE: docker.io/konghui/video-audio-uploader

jobs:
  # ---------- 1. 构建 + 测试整个项目 ----------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装后端依赖
        run: npm ci --no-audit --no-fund
      - name: 编译后端 (tsc)
        run: npm run build
      - name: 单元测试 (vitest)
        run: npm test
      - name: 构建前端 (vite)
        run: cd web && npm ci --no-audit --no-fund && npm run build

  # ---------- 2. 构建 amd64 Docker 镜像并推送 ----------
  docker:
    name: Build & Push Image
    needs: test
    if: github.event_name != 'pull_request' # PR 不推镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
